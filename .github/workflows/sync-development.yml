name: Sync Development Branch with Main

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allow manual triggering

permissions:
  contents: write

jobs:
  sync-development:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          ref: development
          token: ${{ secrets.GITHUB_TOKEN }}
          path: development
          fetch-depth: 0

      - name: Sync development branch with main
        run: |
          cd development
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git fetch origin main

          # main can only change through a rebase merge from development, which
          # preserves commit ids, so main is always an ancestor of development
          # and there is nothing to merge back. The ruleset on development
          # blocks direct pushes anyway, so a back merge cannot be pushed.
          #
          # This job therefore verifies the invariant and fails loudly, with an
          # actionable message, if it is ever broken.
          if git merge-base --is-ancestor origin/main HEAD; then
            echo "development already contains main. Nothing to sync."
            echo "sync_status=not-needed" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "::error::main has commits that development does not have."
          echo "::error::main can only change through a rebase merge from development,"
          echo "::error::which preserves commit ids, so main should always be an"
          echo "::error::ancestor of development. The branches have diverged."
          echo "::error::Reconcile them by hand before promoting or releasing."
          exit 1

      - name: Create sync summary
        run: |
          echo "## Development Branch Sync Summary" >> $GITHUB_STEP_SUMMARY
          echo "✅ development already contains main. No sync was needed." >> $GITHUB_STEP_SUMMARY
          echo "🕐 Sync completed at: $(date)" >> $GITHUB_STEP_SUMMARY
          echo "📝 Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
